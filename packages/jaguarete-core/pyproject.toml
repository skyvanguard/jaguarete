[project]
name = "jaguarete-core"
version = "0.0.2"
description = """Jaguarete is an experimental open-source project that uses localized GPT \
large models to interact with your data and environment. With this solution, you can be\
 assured that there is no risk of data leakage, and your data is 100% private and secure.\
"""
authors = [
    { name = "skyvanguard" }
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "chardet==5.1.0",
    "importlib-resources==5.12.0",
    "cachetools",
    "pydantic>=2.6.0",
    # For AWEL type checking
    "typeguard",
    # Snowflake no additional dependencies.
    "snowflake-id",
    "typing_inspect",
    "tomli>=2.2.1",
    "cloudpickle",
    "requests",
    "numpy>=1.21.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/skyvanguard/jaguarete"
Documentation = "https://github.com/skyvanguard/jaguarete#readme"
Repository = "https://github.com/skyvanguard/jaguarete.git"
Issues = "https://github.com/skyvanguard/jaguarete/issues"

[project.optional-dependencies]
agent = [
    "termcolor",
    "pandas==2.2.3",
    "numpy>=1.21.0,<2.0.0",
    "auto-gpt-plugin-template>=0.0.3",
    "mcp>=1.4.1",
]
rag = [
    "beautifulsoup4",
]
simple_framework = [
    "jinja2",
    "uvicorn",
    "shortuuid",
    "SQLAlchemy>=2.0.25,<2.0.29",
    "msgpack",
    "cloudpickle",
    "pympler",
    "duckdb",
    "duckdb-engine==0.9.1",
    "schedule",
    "sqlparse==0.4.4",
    "python-multipart",
]
proxy_openai = [
    "openai>=1.59.6",
    "tiktoken>=0.8.0",
    "httpx[socks]",
]
proxy_anthropic = ["anthropic"]
proxy_ollama = ["ollama"]
all = [
    "jaguarete-core[agent]",
    "jaguarete-core[rag]",
    "jaguarete-core[simple_framework]",
    "jaguarete-core[proxy_openai]",
    "jaguarete-core[proxy_anthropic]",
    "jaguarete-core[proxy_ollama]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
dev-dependencies = []
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/jaguarete"]
exclude = [
    "src/jaguarete/**/tests",
    "src/jaguarete/**/tests/*",
    "src/jaguarete/tests",
    "src/jaguarete/tests/*",
    "src/jaguarete/**/examples",
    "src/jaguarete/**/examples/*",
]
