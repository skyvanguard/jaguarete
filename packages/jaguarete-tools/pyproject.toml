[project]
name = "jaguarete-tools"
version = "0.1.0"
description = "Security tools for Jaguarete agents"
authors = [{ name = "skyvanguard" }]
requires-python = ">= 3.10"
dependencies = [
    "jaguarete-core[agent]",
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaguarete_tools"]
