[project]
name = "jaguarete-app"
version = "0.0.1"
description = "Jaguarete FastAPI application server with JWT auth"
authors = [{ name = "skyvanguard" }]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "jaguarete-core",
    "jaguarete-agents",
    "jaguarete-tools",
    "jaguarete-knowledge",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaguarete_app"]
