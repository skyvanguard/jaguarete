[project]
name = "jaguarete-knowledge"
version = "0.1.0"
description = "Security knowledge bases for Jaguarete RAG pipeline"
authors = [{ name = "skyvanguard" }]
requires-python = ">= 3.10"
dependencies = [
    "jaguarete-core[rag]",
    "httpx>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaguarete_knowledge"]
